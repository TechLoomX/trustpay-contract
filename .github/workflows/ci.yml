name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: v27.1.0

jobs:
  test:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Stellar CLI
        run: |
          curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          sudo mv stellar /usr/local/bin/stellar
          stellar --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: make test

      - name: Build contract (wasm32v1-none)
        run: make build

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: escrow-wasm
          path: target/wasm32v1-none/release/escrow.wasm
          if-no-files-found: error
